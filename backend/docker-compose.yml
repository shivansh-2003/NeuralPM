# Pinned server tag on purpose — `latest` will eventually drift past your
# qdrant-client and trip the client/server incompatibility warning.
#
# FalkorDB uses the Redis wire protocol (port 6379). It auto-creates one
# graph per user_id (mem0_{user_id}) — no schema setup needed.
# Inspect graphs: docker exec -it neuralpm-falkordb falkordb-cli GRAPH.LIST
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: neuralpm-qdrant
    ports:
      - "6333:6333"   # REST + Web UI (http://localhost:6333/dashboard)
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage

  falkordb:
    image: falkordb/falkordb:latest
    container_name: neuralpm-falkordb
    ports:
      - "6379:6379"   # Redis wire protocol
    volumes:
      - falkordb_storage:/data
    # FalkorDB persists graphs in /data between restarts

volumes:
  qdrant_storage:
  falkordb_storage:
